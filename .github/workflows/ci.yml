# Compila e testa tudo a cada push: firmware (PlatformIO), app Android (Gradle) e receptor da API.
# Os arquivos gerados (firmware .bin e APK) ficam na aba Actions, em "Artifacts" de cada execução.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Firmware ESP32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes da lógica no PC (125 verificações)
        run: make -C firmware/test_host

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Compilar o firmware
        run: pio run -d firmware

      - name: Guardar o firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32
          path: |
            firmware/.pio/build/esp32dev/firmware.bin
            firmware/.pio/build/esp32dev/bootloader.bin
            firmware/.pio/build/esp32dev/partitions.bin

  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Testes do app e compilação do APK (debug)
        working-directory: android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: app-bastao-debug
          path: android/app/build/outputs/apk/debug/*.apk

  integracao:
    name: Receptor da API e ferramentas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes do receptor
        run: python -m unittest integracao/test_bastao_api.py -v
      - name: Simulador de brinco
        run: python tools/simulate_tag.py --stdout --ids 076000000001234 982000123456789
