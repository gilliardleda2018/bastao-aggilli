; Firmware do bastao de coleta RFID (ESP32)
; Versao do platform fixada para manter a API de BLE do Arduino core 2.0.x
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; App grande (BLE + display + SD + LittleFS) com particao de dados para o diario da fila
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
lib_deps =
    olikraus/U8g2@^2.35.19
build_flags =
    -DCORE_DEBUG_LEVEL=0
